# ===================================================
#  CONFIGURACION DEL FRAMEWORK
#
# ===================================================

# URL de la aplicacion bajo prueba
url.base=https://www.saucedemo.com

# Credenciales de prueba
usuario.estandar=standard_user
usuario.bloqueado=locked_out_user
contrasena.valida=secret_sauce

# Navegador: chrome | firefox
navegador=chrome

# Modo sin ventana visible (true para servidores CI/CD)
modo.headless=false

# Tiempos de espera en segundos
espera.explicita=10
espera.implicita=5

# Carpetas de salida
carpeta.capturas=capturas
carpeta.reportes=reportes
nombre.reporte=reporte-pruebas.html

# API de Mercado Libre
api.mercadolibre.departamentos=https://www.mercadolibre.com.ar/menu/departments
